      <sc-if value="{{item.badge}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #8B8B93">{{item.badge}}</span></sc-if>

    <a href="#" style="display: flex; justify-content: center; align-items: center; height: 40px; border-radius: 11px; background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(110,86,255,0.42)); border: 1px solid rgba(155,135,255,0.6); color: #fff; font-weight: 600; text-decoration: none; box-shadow: inset -3px 0 0 #7B61FF, 0 0 20px rgba(110,86,255,0.30)">Remind me</a>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08)">
    <span style="width: 38px; height: 38px; border-radius: 99px; background: linear-gradient(135deg, #2A2A2F, #3A3A42); display: grid; place-items: center; font-weight: 700">AR</span>
    <span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 600">Ali Raza</span><span style="display: block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8B8B93">27267 · 93410-P</span></span>
    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B8B93" stroke-width="2"><path d="m7 10 5-5 5 5M7 14l5 5 5-5"></path></svg>
  </div>
</nav>
